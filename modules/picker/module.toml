# Polynya Module: Screen color picker with clipboard copy and shade generation
api = 1
id = "picker"
exe = "polynya-picker.exe"
kind = "search"
name.ru = "Пипетка"
name.en = "Color picker"
name.zh = "取色器"
name.ja = "カラーピッカー"

# The module in search: opens the picker.
[main]
hint.ru = "Выбор цвета с экрана"
hint.en = "Pick a color from the screen"
hint.zh = "从屏幕选取颜色"
hint.ja = "画面から色を選択"
keywords = ["пипетка", "цвет", "color", "picker", "eyedropper", "pipette", "取色", "颜色", "カラー", "スポイト"]
# Lucide "pipette" icon (ISC)
icon = "m2 22 1-1h3l9-9 | M3 21v-3l9-9 | m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"
