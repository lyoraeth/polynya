[package]
name = "polynya"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace]
members = ["proto", "modules/agents", "modules/notify", "modules/picker", "modules/start"]

# Every unsafe block states why it is sound in a `// SAFETY:` comment.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[lints]
workspace = true

[dependencies]
accesskit = "0.25.2"
accesskit_windows = "0.35.2"
proto = { path = "proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1"
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Numerics", "Media_Control", "Storage_Streams", "Win32_Globalization", "Win32_Graphics_Imaging", "Win32_Media_Audio", "Win32_Networking_WinHttp", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Variant", "Win32_System_Ole", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Registry", "Win32_Security", "Win32_Storage_EnhancedStorage", "Win32_Storage_Packaging_Appx", "Win32_UI_Shell_PropertiesSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input", "Win32_System_Time", "Win32_System_DataExchange", "Win32_System_Memory", "Wdk_System_Threading", "Win32_System_Kernel", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "UI", "UI_ViewManagement", "Win32_System_RemoteDesktop", "Devices_Geolocation", "Win32_UI_Input_Ime", "ApplicationModel", "Management_Deployment", "Foundation_Collections", "UI_Notifications"] }
windows-core = "0.62.2"
windows-numerics = "0.3.1"

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
